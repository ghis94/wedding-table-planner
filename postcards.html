<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartes de table — Wedding Table Planner</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    @font-face { font-family: 'Bodoni Moda'; font-style: normal; font-weight: 500; font-display: swap; src: url('/assets/fonts/BodoniModa-500.ttf') format('truetype'); }
    @font-face { font-family: 'Bodoni Moda'; font-style: normal; font-weight: 600; font-display: swap; src: url('/assets/fonts/BodoniModa-600.ttf') format('truetype'); }
    @font-face { font-family: 'Bodoni Moda'; font-style: normal; font-weight: 700; font-display: swap; src: url('/assets/fonts/BodoniModa-700.ttf') format('truetype'); }
    @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 500; font-display: swap; src: url('/assets/fonts/CormorantGaramond-500.ttf') format('truetype'); }
    @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 600; font-display: swap; src: url('/assets/fonts/CormorantGaramond-600.ttf') format('truetype'); }
    @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 700; font-display: swap; src: url('/assets/fonts/CormorantGaramond-700.ttf') format('truetype'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/fonts/Inter-400.ttf') format('truetype'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('/assets/fonts/Inter-500.ttf') format('truetype'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('/assets/fonts/Inter-600.ttf') format('truetype'); }

    :root {
      --postcard-width: 7.42cm;
      --postcard-height: 12cm;
      --postcard-print-offset: 8.85cm;
    }
    .postcards-page { display:grid; gap:24px; }
    body.paper-white { background:#fffdfa; }
    body.paper-cream { background:#f8f1e8; }
    .postcards-toolbar {
      display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
      padding:16px 18px; border-radius:14px;
      background:linear-gradient(180deg, rgba(255,250,245,.86), rgba(249,240,231,.72));
      border:1px solid rgba(187,151,118,.18);
      box-shadow: var(--shadow-sm);
    }
    .toolbar-controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .toolbar-label {
      display:inline-flex;
      align-items:center;
      gap:6px;
      color:var(--text-muted);
      font-size:12px;
      font-weight:800;
    }
    .toolbar-label select { min-width:220px; }
    .file-button input { display:none; }
    .card-art-name {
      max-width:220px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      color:var(--text-muted);
      font-size:12px;
    }
    .export-hint { width:100%; font-size:12px; color: var(--text-muted); }
    .postcards-grid {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(var(--postcard-width), var(--postcard-width)));
      gap: 24px;
      justify-content:center;
      align-items:start;
    }

    .place-card {
      --card-bg-start:#fdf6ef;
      --card-bg-end:#ebd9c8;
      --title-color:#ab7b4c;
      --accent-line:#bb8d67;
      --label-color:#8a6446;
      --frame-color:rgba(191,150,115,.18);
      --ornament-top:rgba(191,150,115,.16);
      --ornament-bottom:rgba(173,129,98,.10);
      --overlay-highlight:rgba(255,255,255,.22);
      position:relative;
      width:var(--postcard-width);
      height:var(--postcard-height);
      padding:.62cm .48cm .52cm;
      border-radius:18px;
      overflow:hidden;
      border:1px solid var(--frame-color);
      box-shadow: 0 24px 70px rgba(109, 80, 53, .16);
      background: linear-gradient(180deg, var(--card-bg-start), var(--card-bg-end));
      page-break-inside: avoid;
      break-inside: avoid;
      isolation:isolate;
      box-sizing:border-box;
      display:flex;
    }
    .place-card::before {
      content:'';
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 82% 12%, var(--ornament-top), transparent 18%),
        radial-gradient(circle at 16% 88%, var(--ornament-bottom), transparent 20%),
        linear-gradient(180deg, var(--overlay-highlight), transparent 18%);
      pointer-events:none;
      z-index:0;
    }
    .card-art {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:1;
      z-index:0;
      pointer-events:none;
    }
    .place-card.has-card-art {
      padding:0;
      background:#fff;
      border-color:transparent;
    }
    .place-card.has-card-art::before { display:none; }
    .place-card.has-card-art .botanical,
    .place-card.has-card-art .botanical-bottom,
    .place-card.has-card-art .card-frame,
    .place-card.has-card-art .print-card-border,
    .place-card.has-card-art .print-safe-area,
    .place-card.has-card-art .card-eyebrow,
    .place-card.has-card-art .card-divider,
    .place-card.has-card-art .card-footer { display:none; }
    .botanical,
    .botanical-bottom {
      position:absolute;
      pointer-events:none;
      z-index:0;
      opacity:.72;
    }
    .botanical { right:-8px; top:-2px; width:138px; height:210px; }
    .botanical-bottom {
      display:block;
      left:-10px;
      bottom:-8px;
      width:146px;
      height:220px;
      transform: scaleX(-1) rotate(-8deg);
      opacity:.54;
    }
    .card-frame {
      position:absolute;
      inset: 10px;
      border-radius:12px;
      border:1px solid var(--frame-color);
      pointer-events:none;
      z-index:0;
    }
    .card-frame::before,
    .card-frame::after {
      content:'';
      position:absolute;
      width:22px;
      height:22px;
      border:1px solid color-mix(in srgb, var(--frame-color) 140%, white 0%);
      border-radius:50%;
      background: rgba(255,255,255,.3);
    }
    .card-frame::before { top:-11px; left:calc(50% - 11px); }
    .card-frame::after { bottom:-11px; left:calc(50% - 11px); }
    .print-safe-area {
      position:absolute;
      inset: 22px;
      border: 1px dashed var(--frame-color);
      border-radius: 18px;
      pointer-events:none;
      z-index:0;
    }
    .print-card-border {
      display:none;
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      color:var(--poster-edge);
      pointer-events:none;
      z-index:3;
    }

    .card-inner {
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      min-height:100%;
      width:100%;
      align-items:center;
      padding: .18cm 0 .1cm;
      box-sizing:border-box;
    }
    .card-content {
      width:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      flex:1;
      min-height:0;
      padding: .48cm 0 .78cm;
      box-sizing:border-box;
    }
    .card-eyebrow {
      text-align:center;
      color: color-mix(in srgb, var(--label-color) 82%, white 18%);
      text-transform:uppercase;
      letter-spacing:.28em;
      font-size:9px;
      font-weight:700;
      margin-bottom:10px;
    }
    .card-title {
      margin: 0 0 4px;
      font-family:'Bodoni Moda', 'Didot', 'Bodoni 72', 'Bodoni 72 Smallcaps', 'Cormorant Garamond', serif;
      font-size: clamp(1.36rem, 1.82vw, 1.66rem);
      line-height:1;
      text-align:center;
      color: color-mix(in srgb, var(--label-color) 72%, #1f1a16 28%);
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.13em;
      font-variant-ligatures: discretionary-ligatures;
      text-wrap:balance;
      text-shadow: 0 1px 0 rgba(255,255,255,.45);
    }
    .card-divider {
      width:60px; height:1px; margin: 6px auto 8px;
      background: linear-gradient(90deg, transparent, var(--accent-line), transparent);
    }
    .guest-list {
      display:grid;
      gap:6px;
      margin-top:10px;
      align-content:start;
      justify-content:stretch;
      align-self:stretch;
      padding: 0 2px;
      flex:0;
    }
    .guest-item {
      text-align:center;
      color: color-mix(in srgb, var(--label-color) 68%, #1f1a16 32%);
      font-size:12px;
      line-height:1.12;
      font-family:'Cormorant Garamond', 'Adobe Garamond Pro', 'Garamond', serif;
      font-weight:600;
      letter-spacing:.018em;
      text-wrap:balance;
      padding: 2px 0;
    }
    .place-card.is-dense {
      padding:.54cm .42cm .48cm;
    }
    .place-card.is-dense .card-eyebrow { margin-bottom:7px; font-size:8px; }
    .place-card.is-dense .card-title { font-size: clamp(1.24rem, 1.65vw, 1.5rem); }
    .place-card.is-dense .card-divider { margin: 5px auto 7px; }
    .place-card.is-dense .guest-list { margin-top:8px; }
    .place-card.is-dense .guest-list { gap:4px; }
    .place-card.is-dense .guest-item { font-size:10px; line-height:1.04; }
    .place-card.is-dense .card-footer { padding-top:8px; font-size:9px; }

    .place-card.is-very-dense {
      padding:.48cm .38cm .42cm;
    }
    .place-card.is-very-dense .card-frame { inset: 8px; }
    .place-card.is-very-dense .card-eyebrow { margin-bottom:5px; font-size:7px; letter-spacing:.22em; }
    .place-card.is-very-dense .card-title { margin: 0 0 2px; font-size: clamp(1.06rem, 1.42vw, 1.26rem); }
    .place-card.is-very-dense .card-divider { width:52px; margin: 4px auto 6px; }
    .place-card.is-very-dense .guest-list { margin-top:6px; }
    .place-card.is-very-dense .guest-list { gap:3px; }
    .place-card.is-very-dense .guest-item { font-size:8.8px; line-height:1.02; }
    .place-card.is-very-dense .card-footer { padding-top:6px; font-size:8px; letter-spacing:.16em; }
    .place-card.is-two-columns .guest-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items:start;
      column-gap:7px;
      row-gap:4px;
    }
    .place-card.is-two-columns .guest-item {
      font-size:8.6px;
      line-height:1.02;
      min-width:0;
    }
    .place-card.has-few-guests .guest-list {
      align-content:center;
      gap:9px;
    }
    .place-card.has-few-guests .guest-item {
      font-size:14px;
      line-height:1.08;
    }
    .place-card.has-medium-guests .guest-list {
      align-content:center;
      gap:7px;
    }
    .place-card.has-medium-guests .guest-item {
      font-size:13px;
      line-height:1.1;
    }
    .card-footer {
      margin-top:0;
      padding-bottom:0.1cm;
      text-align:center;
      color: color-mix(in srgb, var(--label-color) 82%, white 18%);
      font-size:10px;
      letter-spacing:.22em;
      text-transform:uppercase;
    }
    .template-card {
      position:relative;
      z-index:1;
      width:100%;
      min-height:100%;
      display:block;
      padding:0;
      color:#1d1713;
      text-shadow:0 1px 1px rgba(255,255,255,.55);
    }
    .template-table-number {
      position:absolute;
      left:12%;
      right:12%;
      top:18%;
      text-align:center;
      font-family:'Bodoni Moda', 'Didot', 'Bodoni 72', serif;
      font-size:34px;
      line-height:1;
      font-weight:700;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .template-table-name {
      position:absolute;
      left:12%;
      right:12%;
      top:25%;
      text-align:center;
      font-family:'Cormorant Garamond', 'Adobe Garamond Pro', 'Garamond', serif;
      font-size:22px;
      line-height:1;
      font-weight:700;
    }
    .template-guests {
      position:absolute;
      left:13%;

<body>
  <script src="theme.js"></script>
  <script src="header.js" defer></script>
  <div class="wrap">
    <div class="crumbs"><a href="admin.html">Admin</a> · <a href="visual.html">Plan visuel</a> · <a href="postcards.html">Cartes</a></div>
    <div class="postcards-page">
      <section class="hero">
        <h1>Cartes de table</h1>
        <p id="formatDescription">Affiches 12×7,42 en portrait, prêtes à imprimer.</p>
      </section>
      <div class="postcards-toolbar">
        <div class="muted">Choisis le fond selon le papier : blanc ou crème.</div>
        <div class="toolbar-controls">
          <label class="toolbar-label">Plan actif
            <select id="activePlanSelect" class="mini-select" onchange="activateSelectedPlan()"></select>
          </label>
          <button class="ghost danger-text" onclick="deleteSelectedPlan()">Supprimer la variante</button>
          <label class="toolbar-label">Format
            <select id="formatSelect" class="mini-select" onchange="applyCardFormat(this.value)"></select>
          </label>
          <select id="themeSelect" class="mini-select" style="min-width:220px" onchange="applyTheme(this.value)"></select>
          <div class="toolbar" style="padding:0;background:none;border:0;box-shadow:none;position:static">
            <button id="printButton" onclick="downloadPdf()">Imprimer / PDF A4</button>
            <button class="ghost" onclick="load()">Rafraîchir</button>
          </div>
          <span id="cardArtName" class="card-art-name"></span>
          <div id="formatHint" class="export-hint">Mode recommandé : impression directe en 12×7,42 portrait, une carte par page.</div>
        </div>
      </div>
      <div id="cards" class="postcards-grid"></div>
    </div>
  </div>

  <script>
    const exportBootstrap = window.__POSTCARDS_EXPORT__ || null;
    const exportQuery = new URLSearchParams(window.location.search);
    const themeGroups = [
      { label: 'Papier', options: [['paper-white','Blanc'],['paper-cream','Crème']] }
    ];
    const allThemeOptions = themeGroups.flatMap(group => group.options);
    const cardFormats = {
      '10x15': { label: '10×15', description: 'Affiches 10×15 prêtes à imprimer.', widthCm: 10, heightCm: 15, offsetCm: 7.35 },
      '12x7-42': { label: '12×7,42 portrait', description: 'Affiches 12×7,42 en portrait, prêtes à imprimer.', widthCm: 7.42, heightCm: 12, offsetCm: 8.85 },
      '10x10': { label: '10×10', description: 'Affiches carrées 10×10 prêtes à imprimer.', widthCm: 10, heightCm: 10, offsetCm: 9.85 }
    };
    let currentTheme = exportBootstrap?.theme || exportQuery.get('theme') || localStorage.getItem('postcards-theme') || 'paper-white';
    let currentFormat = exportBootstrap?.format || exportQuery.get('format') || localStorage.getItem('postcards-format') || '12x7-42';
    let planVariants = [];
    let activePlanId = '';
    let cardArt = '';
    let cardArtName = '';

    function escapeHtml(v){ return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'); }
    function escapeAttr(v){ return escapeHtml(v).replaceAll('`','&#96;'); }
    async function api(url, opts={}){
      const r = await fetch(url, opts);
      if(!r.ok) throw new Error(await r.text());
      return r.json();
    }
    function renderActivePlanSelect(){
      const select = document.getElementById('activePlanSelect');
      if(!select) return;
      select.innerHTML = '';
      planVariants.forEach(plan => {
        const option = document.createElement('option');
        option.value = plan.id;
        option.textContent = plan.active ? `${plan.name} - actif` : plan.name;
        option.selected = plan.id === activePlanId;
        select.appendChild(option);
      });
    }
    async function loadPlans(){
      if (exportBootstrap) {
        planVariants = [];
        activePlanId = '';
        renderActivePlanSelect();
        return;
      }
      const res = await api('/api/plans');
      planVariants = res.plans || [];
      activePlanId = res.activePlanId || planVariants.find(p => p.active)?.id || '';
      renderActivePlanSelect();
    }
    async function activatePlan(planId){
      if(!planId || planId === activePlanId) return;
      try{
        await api(`/api/plans/${encodeURIComponent(planId)}/activate`, { method:'POST' });
        await loadPlans();
        await load();
      }catch(e){
        alert('Impossible d’activer ce plan');
        await loadPlans().catch(()=>{});
      }
    }
    function activateSelectedPlan(){
      activatePlan(document.getElementById('activePlanSelect')?.value);
    }
    async function deleteSelectedPlan(){
      const planId = document.getElementById('activePlanSelect')?.value;
      if(!planId) return;
      const selected = planVariants.find(plan => plan.id === planId);
      if(planVariants.length <= 1){ alert('Impossible de supprimer le dernier plan'); return; }
      if(!confirm(`Supprimer la variante "${selected?.name || 'Plan'}" ?`)) return;
      try{
        await api(`/api/plans/${encodeURIComponent(planId)}`, { method:'DELETE' });
        await loadPlans();
        await load();
      }catch(e){
        alert('Impossible de supprimer cette variante');
      }
    }
    function updateCardArtLabel(){
      const el = document.getElementById('cardArtName');
      if(el) el.textContent = cardArt ? `Visuel: ${cardArtName || 'image importée'}` : '';
    }
    function initFormatSelect() {
      const select = document.getElementById('formatSelect');
      if (!select) return;
      select.innerHTML = Object.entries(cardFormats)
        .map(([value, format]) => `<option value="${value}">${format.label}</option>`)
        .join('');
      if (!cardFormats[currentFormat]) currentFormat = '12x7-42';
      select.value = currentFormat;
    }
    function applyCardFormat(format, { persist = true, reload = true } = {}) {
      currentFormat = cardFormats[format] ? format : '12x7-42';
      const selected = cardFormats[currentFormat];
      document.body.dataset.cardFormat = currentFormat;
      document.documentElement.style.setProperty('--postcard-width', `${selected.widthCm}cm`);
      document.documentElement.style.setProperty('--postcard-height', `${selected.heightCm}cm`);
      document.documentElement.style.setProperty('--postcard-print-offset', `${selected.offsetCm}cm`);
      const description = document.getElementById('formatDescription');
      const printButton = document.getElementById('printButton');
      const hint = document.getElementById('formatHint');
      if (description) description.textContent = selected.description;
      if (printButton) printButton.textContent = `Imprimer / PDF A4 - carte ${selected.label}`;
      if (hint) hint.textContent = `Mode recommandé : impression directe en ${selected.label}, une carte par page.`;
      if (persist) localStorage.setItem('postcards-format', currentFormat);
      if (reload) load();
    }
    function loadCardArt(event){
      const file = event.target.files?.[0];
      if(!file) return;
      if(!file.type.startsWith('image/')){ alert('Choisis une image PNG, JPG ou WebP'); event.target.value=''; return; }
      const reader = new FileReader();
      reader.onload = () => {
        cardArt = String(reader.result || '');
        cardArtName = file.name || 'image importée';
        localStorage.setItem('postcards-card-art', cardArt);
        localStorage.setItem('postcards-card-art-name', cardArtName);
        updateCardArtLabel();
        load();
      };
      reader.readAsDataURL(file);
    }
    function clearCardArt(){
      cardArt = '';
      cardArtName = '';
      localStorage.removeItem('postcards-card-art');
      localStorage.removeItem('postcards-card-art-name');
      const input = document.getElementById('cardArtFile');
      if(input) input.value = '';
      updateCardArtLabel();
      load();
    }
    function floralSvg(cls='') {
      return `
        <svg class="${cls}" viewBox="0 0 180 260" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M68 248C74 213 78 181 77 149C76 121 67 92 48 63" stroke="#B88D66" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
          <path d="M80 231C102 201 112 171 112 136C112 104 103 73 84 44" stroke="#9A6F4E" stroke-width="1.9" stroke-linecap="round" opacity=".45"/>
          <path d="M41 86C26 83 16 72 12 54C27 58 38 66 45 80" fill="#DAB9A1" opacity=".7"/>
          <path d="M34 118C18 117 8 109 3 93C20 96 31 104 38 113" fill="#E6CAB7" opacity=".62"/>
          <path d="M98 62C112 55 121 42 124 24C111 28 100 37 94 51" fill="#C89A72" opacity=".58"/>
          <path d="M120 104C136 98 146 85 150 68C135 72 124 82 117 95" fill="#D9B296" opacity=".55"/>
          <circle cx="85" cy="40" r="10" fill="#E7D0BF" opacity=".65"/>
          <circle cx="49" cy="78" r="8" fill="#E2C3AD" opacity=".56"/>

          <circle cx="25" cy="110" r="7" fill="#EAD6C7" opacity=".58"/>
        </svg>`;
    }
    function footerOrnamentSvg() {
      return `
        <svg class="footer-ornament" viewBox="0 0 220 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
            <path d="M39 16H83"/>
            <path d="M36 16C25 16 16 13.5 8 9.5"/>
            <path d="M28 14.5C25.8 8.5 21.7 5 16 4.2C16.6 9.7 20.6 13.4 28 14.5Z"/>

            <path d="M49 16.2C43.2 18.1 39.9 21.5 39.1 26.4C44.3 25.7 47.6 22.3 49 16.2Z"/>
            <path d="M181 16H137"/>
            <path d="M184 16C195 16 204 13.5 212 9.5"/>
            <path d="M192 14.5C194.2 8.5 198.3 5 204 4.2C203.4 9.7 199.4 13.4 192 14.5Z"/>
            <path d="M178 16.1C181.7 10.8 186.2 8.1 191.5 8.1C189.8 13.3 185.3 16 178 16.1Z"/>
            <path d="M171 16.2C176.8 18.1 180.1 21.5 180.9 26.4C175.7 25.7 172.4 22.3 171 16.2Z"/>
            <path d="M98.6 13.2C98.6 10.2 100.8 8 103.7 8C106.3 8 108.2 9.8 110 12.4C111.8 9.8 113.7 8 116.3 8C119.2 8 121.4 10.2 121.4 13.2C121.4 18.1 115.7 22.4 110 26.7C104.3 22.4 98.6 18.1 98.6 13.2Z"/>
          </g>
        </svg>`;
    }
    function printCardBorderSvg() {
      const format = cardFormats[currentFormat] || cardFormats['12x7-42'];
      const width = format.widthCm * 10;
      const height = format.heightCm * 10;
      const outerWidth = Math.max(0, width - 1.1);
      const outerHeight = Math.max(0, height - 1.1);
      const innerWidth = Math.max(0, width - 7.4);
      const innerHeight = Math.max(0, height - 7.4);
      return `
        <svg class="print-card-border" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x=".55" y=".55" width="${outerWidth}" height="${outerHeight}" rx="5.8" ry="5.8" stroke="currentColor" stroke-width=".32"/>
          <rect x="3.7" y="3.7" width="${innerWidth}" height="${innerHeight}" rx="4.4" ry="4.4" stroke="currentColor" stroke-width=".26"/>
        </svg>`;
    }
    function densityClass(count) {
      if (count >= 13) return 'is-very-dense';
      if (count >= 9) return 'is-dense';
      return '';
    }
    function layoutClass(count) {
      return count >= 13 ? 'is-two-columns' : '';
    }
    function guestDensityClass(count) {
      if (count <= 6) return 'has-few-guests';
      if (count <= 8) return 'has-medium-guests';
      return '';
    }
    function getTablePlanGuests(table) {
      return (table.guests || []).filter(Boolean);
    }
    function tableNumber(table, index) {
      const fromNumber = Number(table.number || table.numero || table.tableNumber || 0);
      if(Number.isFinite(fromNumber) && fromNumber > 0) return String(fromNumber);
      const match = String(table.name || '').match(/\d+/);
      return match ? match[0] : String(index + 1);
    }
    function tableNameWithoutNumber(table, number) {
      const name = String(table.name || '').trim();
      if(!name) return '';
      const normalized = name.toLowerCase().replace(/\s+/g, ' ');
      if(normalized === `table ${number}` || normalized === `table n ${number}` || normalized === `table n° ${number}` || normalized === `table no ${number}`) return '';
      return name;
    }
    function buildTemplateMarkup(table, guests, index) {
      const number = tableNumber(table, index);
      const displayName = tableNameWithoutNumber(table, number);
      return `
        <img class="card-art" src="${escapeAttr(cardArt)}" alt="">
        <div class="template-card">
          <div class="template-table-number">Table ${escapeHtml(number)}</div>
          ${displayName ? `<div class="template-table-name">${escapeHtml(displayName)}</div>` : ''}
          <div class="template-guests">
            ${guests.length ? guests.map(g => `<div class="guest-item">${escapeHtml(g.name || 'Invité')}</div>`).join('') : '<div class="guest-item">Table en préparation</div>'}
          </div>
        </div>`;
    }
    function buildCardMarkup(table, guests, index) {
      const number = tableNumber(table, index);
      const displayName = tableNameWithoutNumber(table, number);
      return `
        ${printCardBorderSvg()}
        <div class="card-frame"></div>
        <div class="print-safe-area"></div>
        <div class="card-inner">
          <div class="card-content">
            <div class="card-title">Table ${escapeHtml(number)}</div>
            ${displayName ? `<div class="card-eyebrow">${escapeHtml(displayName)}</div>` : ''}
            <div class="card-divider"></div>
            <div class="guest-list">
              ${guests.length ? guests.map(g => `<div class="guest-item">${escapeHtml(g.name || 'Invité')}</div>`).join('') : '<div class="guest-item">Table en préparation</div>'}
            </div>
            <div class="card-footer" aria-hidden="true">${footerOrnamentSvg()}</div>
          </div>
          <div class="botanical-bottom" aria-hidden="true">${floralSvg('')}</div>
        </div>`;
    }
    function initThemeSelect() {
      const select = document.getElementById('themeSelect');
      if (!select) return;
      select.innerHTML = themeGroups.map(group => `
        <optgroup label="${group.label}">
          ${group.options.map(([value, label]) => `<option value="${value}">${label}</option>`).join('')}
        </optgroup>
      `).join('');
      if (!allThemeOptions.some(([value]) => value === currentTheme)) currentTheme = 'paper-white';
      select.value = currentTheme;
    }
    function applyTheme(theme) {
      currentTheme = theme;
      localStorage.setItem('postcards-theme', currentTheme);
      document.body.classList.remove('paper-white', 'paper-cream');
      document.body.classList.add(currentTheme);
      load();
    }
    function downloadPdf() {
      window.print();
    }
    async function load(){
      const plan = exportBootstrap?.plan || await (async () => {
        const r = await fetch('/api/plan');
        if(!r.ok){
          document.getElementById('cards').innerHTML = '<div class="empty-state">Connexion requise.</div>';
          return null;
        }
        return await r.json();
      })();
      if(!plan) return;
      const cards = document.getElementById('cards');
      const tables = (plan.tables || []).filter(Boolean);
      if(!tables.length){ cards.innerHTML = '<div class="empty-state">Aucune table disponible.</div>'; return; }
      cards.innerHTML = '';
      tables.forEach((table, index) => {
        const guests = getTablePlanGuests(table);
        const el = document.createElement('article');
        el.className = `place-card ${currentTheme} ${densityClass(guests.length)} ${layoutClass(guests.length)} ${guestDensityClass(guests.length)}`.trim();
        el.innerHTML = buildCardMarkup(table, guests, index);
        cards.appendChild(el);
      });
    }
    initThemeSelect();
    document.body.classList.add(currentTheme);
    initFormatSelect();
    applyCardFormat(currentFormat, { persist: !exportBootstrap, reload: false });
    updateCardArtLabel();
    loadPlans().catch(()=>{});
    load();
  </script>
</body>
</html>
