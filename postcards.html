<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartes de table — Wedding Table Planner</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap');

    .postcards-page { display:grid; gap:24px; }
    .postcards-toolbar {
      display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
      padding:16px 18px; border-radius:22px;
      background:linear-gradient(180deg, rgba(255,250,245,.86), rgba(249,240,231,.72));
      border:1px solid rgba(187,151,118,.18);
      box-shadow: var(--shadow-sm);
    }
    .toolbar-controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .export-hint { width:100%; font-size:12px; color: var(--text-muted); }
    .postcards-grid {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(10cm, 10cm));
      gap:24px;
      justify-content:center;
      align-items:start;
    }

    .place-card {
      position:relative;
      width:10cm;
      height:15cm;
      padding:1.82cm .72cm 1.75cm;
      border:1px solid #c8beb5;
      border-radius:16px;
      overflow:hidden;
      background:#fbfaf8;
      box-shadow:0 18px 50px rgba(45, 38, 31, .10);
      box-sizing:border-box;
      color:#0f0d0b;
      display:flex;
      justify-content:center;
      page-break-inside:avoid;
      break-inside:avoid;
      font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    }
    .place-card::before {
      content:'';
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 20% 13%, rgba(219,213,206,.28), transparent 23%),
        radial-gradient(circle at 84% 82%, rgba(226,221,214,.24), transparent 25%),
        linear-gradient(180deg, rgba(255,255,255,.96), rgba(247,244,240,.64));
      pointer-events:none;
    }
    .card-inner {
      position:relative;
      z-index:1;
      width:100%;
      min-height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
    }
    .card-title {
      margin:0 0 .84cm;
      text-transform:uppercase;
      letter-spacing:.34em;
      font-size:30px;
      line-height:1;
      font-weight:500;
      white-space:nowrap;
      transform:translateX(.17em);
    }
    .guest-list {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:.25cm;
      margin:0;
      width:100%;
    }
    .guest-item {
      font-size:25px;
      line-height:1.05;
      font-weight:500;
      white-space:nowrap;
    }
    .card-ornament {
      width:2.45cm;
      height:.38cm;
      margin-top:auto;
      margin-bottom:.2cm;
      color:#4b3b32;
      overflow:visible;
    }
    .is-dense { padding-top:1.55cm; padding-bottom:1.45cm; }
    .is-dense .card-title { margin-bottom:.58cm; font-size:27px; }
    .is-dense .guest-list { gap:.16cm; }
    .is-dense .guest-item { font-size:21px; }
    .is-very-dense { padding-top:1.32cm; padding-bottom:1.2cm; }
    .is-very-dense .card-title { margin-bottom:.42cm; font-size:24px; }
    .is-very-dense .guest-list { gap:.1cm; }
    .is-very-dense .guest-item { font-size:17px; white-space:normal; }

    .empty-state {
      padding:20px; text-align:center; border-radius:18px; background:rgba(255,255,255,.38); color:var(--text-muted); border:1px solid var(--line-soft);
    }

    @media print {
      @page { size: 10cm 15cm portrait; margin: 0; }
      html, body { width:10cm; height:15cm; }
      body::before, .wedding-header, .postcards-toolbar, .crumbs, .hero { display:none !important; }
      body { background:#fff !important; margin:0 !important; }
      .wrap { max-width:none; padding:0 !important; margin:0 !important; }
      .postcards-grid { display:block; width:10cm !important; }
      .place-card { width:10cm !important; height:15cm !important; border-radius:16px; box-shadow:none; margin:0; page-break-after:always; break-after:page; }
      .place-card:last-child { page-break-after:auto; break-after:auto; }
    }
  </style>
</head>
<body>
  <script src="theme.js"></script>
  <script src="header.js" defer></script>
  <div class="wrap">
    <div class="crumbs"><a href="admin.html">Admin</a> · <a href="visual.html">Plan visuel</a> · <a href="postcards.html">Cartes</a></div>
    <div class="postcards-page">
      <section class="hero">
        <h1>Cartes de table</h1>
        <p>Des cartes portrait 10×15 fidèles au modèle fourni : fond ivoire, contour fin, titre espacé, liste centrée et petit ornement.</p>
      </section>
      <div class="postcards-toolbar">
        <div class="muted">Format portrait 10×15 pour annoncer la table des invités.</div>
        <div class="toolbar-controls">
          <div class="toolbar" style="padding:0;background:none;border:0;box-shadow:none;position:static">
            <button onclick="window.print()">Imprimer en 10×15</button>
            <button class="ghost" onclick="load()">Rafraîchir</button>
          </div>
          <div class="export-hint">Mode recommandé : impression directe en 10×15, une carte par page.</div>
        </div>
      </div>
      <div id="cards" class="postcards-grid"></div>
    </div>
  </div>

  <script>
    function escapeHtml(v){ return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'); }
    function densityClass(count) {
      if (count >= 15) return 'is-very-dense';
      if (count >= 11) return 'is-dense';
      return '';
    }
    function getSortedGuests(table) {
      return (table.guests || []).filter(Boolean).slice().sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'fr', { sensitivity: 'base' }));
    }
    function ornamentSvg() {
      return `
        <svg class="card-ornament" viewBox="0 0 112 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M2 9H28" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
          <path d="M84 9H110" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
          <path d="M20 9C14 2 8 4 5 6C11 6 16 8 20 9Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
          <path d="M22 9C17 16 11 15 7 13C13 12 18 10 22 9Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
          <path d="M30 9C25 3 20 4 17 6C22 6 26 8 30 9Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
          <path d="M82 9C87 3 92 4 95 6C90 6 86 8 82 9Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
          <path d="M80 9C85 16 91 15 95 13C89 12 84 10 80 9Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
          <path d="M92 9C98 2 104 4 107 6C101 6 96 8 92 9Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
          <path d="M56 14C49 9 47 5 50 2C53 -1 56 4 56 4C56 4 59 -1 62 2C65 5 63 9 56 14Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>`;
    }
    function buildCardMarkup(table, guests) {
      return `
        <div class="card-inner">
          <div class="card-title">${escapeHtml(table.name || 'Table')}</div>
          <div class="guest-list">
            ${guests.length ? guests.map(g => `<div class="guest-item">${escapeHtml(g.name || 'Invité')}</div>`).join('') : '<div class="guest-item">Table en préparation</div>'}
          </div>
          ${ornamentSvg()}
        </div>`;
    }
    async function load(){
      const r = await fetch('/api/plan');
      if(!r.ok){ document.getElementById('cards').innerHTML = '<div class="empty-state">Connexion requise.</div>'; return; }
      const plan = await r.json();
      const cards = document.getElementById('cards');
      const tables = (plan.tables || []).filter(Boolean);
      if(!tables.length){ cards.innerHTML = '<div class="empty-state">Aucune table disponible.</div>'; return; }
      cards.innerHTML = '';
      tables.forEach((table) => {
        const guests = getSortedGuests(table);
        const el = document.createElement('article');
        el.className = `place-card ${densityClass(guests.length)}`.trim();
        el.innerHTML = buildCardMarkup(table, guests);
        cards.appendChild(el);
      });
    }
    load();
  </script>
</body>
</html>
